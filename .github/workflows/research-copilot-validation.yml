name: Research Copilot Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.js'
      - 'provider-cost.js'
      - 'security.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/research-copilot-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete AI API test suite
        run: npm test
      - name: Parse service module
        run: node --check index.js
