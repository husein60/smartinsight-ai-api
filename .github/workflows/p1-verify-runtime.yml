name: P1 Verify Legacy AI Runtime

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'p1/legacy-operational-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p1/legacy-operational-hardening
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check index.js
      - name: Record successful P1 verification
        shell: bash
        run: |
          if [ -f .p1-runtime-verified ]; then
            echo "P1 verification marker already present"
            exit 0
          fi
          printf '%s\n' 'Node 24 + npm ci + node --check verified by GitHub Actions' > .p1-runtime-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p1-runtime-verified
          git commit -m "P1: record legacy AI runtime verification"
          git push origin HEAD:p1/legacy-operational-hardening
